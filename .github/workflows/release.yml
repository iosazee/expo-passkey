name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Provenance requires npm >= 11.5.1. Node 22's bundled npm is 10.x,
      # and `npm install -g npm@latest` has been flaky on GitHub runners
      # (intermittent `Cannot find module 'promise-retry'` in the runner's
      # pre-installed npm). corepack ships a clean npm without self-update
      # races.
      - name: Activate npm via corepack
        run: |
          corepack enable
          corepack prepare npm@11.5.1 --activate
          npm --version

      - run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
