name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # No `registry-url` and no NODE_AUTH_TOKEN: this package publishes
      # via npm Trusted Publishers (OIDC). setup-node's `registry-url`
      # would write `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # into .npmrc — and an empty _authToken= line suppresses npm's
      # OIDC token-exchange, causing the registry to reject the PUT
      # with 404 even though sigstore provenance signing succeeds.
      # See https://docs.npmjs.com/trusted-publishers
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Provenance + Trusted Publishers require npm >= 11.5.1. Node 22's
      # bundled npm is 10.x. corepack ships a clean npm without the
      # `npm install -g npm@latest` self-update race that's been
      # intermittently broken on GitHub runners.
      - name: Activate npm via corepack
        run: |
          corepack enable
          corepack prepare npm@11.5.1 --activate
          npm --version

      - run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
